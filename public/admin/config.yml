# Sveltia CMS — painel de conteúdo do Cinnamon Drinks
# Editável pelo Roger em /admin/. Cada collection casa 1:1 com src/content.config.ts.
# NUNCA commitar tokens aqui — auth via Cloudflare Worker OAuth (cms-oauth/).

backend:
  name: github
  repo: Cinnamon-Drinks/Cinnamon-drinks-landing-page
  branch: main
  base_url: https://cinnamon-cms-oauth.rogercinnamondrinks.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: 'CMS: cria {{collection}} "{{slug}}"'
    update: 'CMS: atualiza {{collection}} "{{slug}}"'
    delete: 'CMS: remove {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: upload de mídia "{{path}}"'
    deleteMedia: 'CMS: remove mídia "{{path}}"'

# Dev local: abrir /admin/ no Chrome/Edge e usar "Work with Local Repository"
# (File System Access API — o Sveltia não usa proxy server).
publish_mode: simple
site_url: https://cinnamondrinks.com.br
display_url: https://cinnamondrinks.com.br

# Slugs sem acento evitam rotas como /menu/orçamento-3. O Astro usa o nome
# do arquivo como id da página estática, então o CMS deve gravar orcamento-3.yml.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Toda mídia enviada pelo CMS vai para public/uploads/ e é servida em /uploads/.
media_folder: public/uploads
public_folder: /uploads

collections:
  # ── Arquivo único (object widget = chave-wrapper do .yml) ─────────────
  - name: site
    label: Configurações gerais
    icon: settings
    files:
      - name: site
        label: Site
        file: src/content/site.yml
        fields:
          - name: site
            label: Configurações
            widget: object
            fields:
              - { name: brandName, label: Nome da marca, widget: string }
              - { name: tagline, label: Slogan, widget: string }
              - name: cnpj
                label: CNPJ
                widget: string
                hint: 'Formato XX.XXX.XXX/XXXX-XX'
                pattern: ['^\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}$', 'Use o formato XX.XXX.XXX/XXXX-XX']
              - { name: city, label: 'Cidade-base (exibida no rodapé)', widget: string }
              - { name: address, label: Endereço completo (uso interno), widget: text }
              - { name: businessHours, label: Horário comercial, widget: string }
              - name: whatsappNumber
                label: WhatsApp comercial
                widget: string
                hint: 'Somente números, formato 5535999999999'
                pattern: ['^\d{12,13}$', 'Use o formato 5535999999999 (12 ou 13 dígitos)']
              - name: email
                label: E-mail
                widget: string
                pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'E-mail inválido']
              - { name: instagram, label: 'Instagram (handle sem @)', widget: string }
              - { name: responsibleConsumptionNotice, label: 'Aviso de consumo responsável', widget: string }

  - name: hero
    label: Início (Hero)
    icon: home
    files:
      - name: hero
        label: Hero
        file: src/content/hero.yml
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: subheading, label: Subtítulo, widget: text }
              - { name: ctaText, label: Texto do botão, widget: string }
              - name: gallery
                label: Galeria
                widget: list
                min: 1
                fields:
                  - name: type
                    label: Tipo
                    widget: select
                    options: [image, video]
                  - { name: src, label: Arquivo, widget: file }
                  - { name: alt, label: Texto alternativo, widget: string }

  - name: about
    label: Sobre
    icon: info
    files:
      - name: about
        label: Sobre
        file: src/content/about.yml
        fields:
          - name: about
            label: Sobre
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: body, label: Texto, widget: markdown }
              - name: foundedYear
                label: Ano de fundação
                widget: number
                value_type: int
                min: 2000
                max: 2030
              - { name: mainPhoto, label: Foto principal, widget: image }

  - name: team
    label: Equipe
    icon: group
    files:
      - name: team
        label: Equipe
        file: src/content/team.yml
        fields:
          - name: team
            label: Equipe
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: intro, label: Introdução, widget: text }
              - name: members
                label: Membros
                widget: list
                fields:
                  - { name: name, label: Nome, widget: string }
                  - { name: role, label: Cargo, widget: string }
                  - { name: photo, label: Foto, widget: image }
                  - { name: certifications, label: Certificações, widget: list, required: false }

  # ── Pasta (uma entrada por arquivo) ───────────────────────────────────
  - name: drinks
    label: Drinks (Menu)
    label_singular: Drink
    icon: local_bar
    folder: src/content/drinks
    extension: yml
    format: yml
    identifier_field: name
    slug: '{{slug}}'
    create: true
    fields:
      - { name: name, label: Nome, widget: string }
      - name: category
        label: Categoria
        widget: select
        options: ["Caip's", 'Clássicos', 'Gin & Whisky', 'Especiais']
      - { name: ingredients, label: Ingredientes, widget: list, min: 1 }
      - { name: image, label: Foto, widget: image, required: false }
      - name: order
        label: Ordem na categoria
        widget: number
        value_type: int
        min: 1

  - name: bars
    label: Estrutura — Bares
    label_singular: Bar
    icon: storefront
    folder: src/content/bars
    extension: yml
    format: yml
    identifier_field: name
    slug: '{{slug}}'
    create: true
    fields:
      - { name: name, label: Nome do bar, widget: string }
      - { name: description, label: Descrição, widget: text }
      - name: gallery
        label: Galeria de fotos
        widget: list
        min: 1
        fields:
          - { name: src, label: Foto, widget: image }
          - { name: alt, label: Texto alternativo, widget: string }
      - name: tallPhoto
        label: 'Foto vertical (painel alto do Menu 1)'
        hint: 'Enquadramento retrato/vertical — a galeria acima é horizontal e corta mal nesse painel. Deixe em branco até ter uma foto no formato certo.'
        widget: object
        required: false
        fields:
          - { name: src, label: Foto, widget: image }
          - { name: alt, label: Texto alternativo, widget: string }
      - name: order
        label: Ordem
        widget: number
        value_type: int

  # ── Menu institucional (fixo): file collections não têm botão criar/excluir ──
  # no CMS, o que trava os 3 itens do menu contra exclusão acidental. `type` é
  # hidden e OBRIGATÓRIO declarar em cada file: sem ele o Sveltia apaga a chave no
  # 1º save e o discriminatedUnion de menuPackages (content.config.ts) quebra no
  # build. O campo `hidden` é omitido de propósito — esses 3 são sempre visíveis.
  - name: siteStructures
    label: Estrutura e Serviços
    icon: deck
    files:
      - name: estruturas
        label: Estruturas
        file: src/content/menu-packages/estruturas.yml
        fields:
          - { name: type, widget: hidden, default: structure }
          - { name: name, label: Nome do pacote, widget: string, hint: 'Ex: "Estruturas" ou "Serviços Extras"' }
          - name: labels
            label: 'Rótulos (máx. 5)'
            widget: list
            min: 1
            max: 5
            hint: 'Cada rótulo vira uma aba na página, com nome, descrição, imagem e preço próprios.'
            fields:
              - { name: name, label: Nome do rótulo, widget: string, hint: 'Ex: "Bike Spritz"' }
              - { name: description, label: Descrição, widget: text, required: false }
              - name: image
                label: Imagem
                widget: object
                required: false
                fields:
                  - { name: src, label: Foto, widget: image }
                  - { name: alt, label: Texto alternativo, widget: string }
              - { name: price, label: 'Preço (opcional)', widget: string, required: false }
          - name: order
            label: Ordem
            widget: number
            value_type: int
      - name: servicos-extras
        label: Serviços Extras
        file: src/content/menu-packages/servicos-extras.yml
        fields:
          - { name: type, widget: hidden, default: structure }
          - { name: name, label: Nome do pacote, widget: string, hint: 'Ex: "Estruturas" ou "Serviços Extras"' }
          - name: labels
            label: 'Rótulos (máx. 5)'
            widget: list
            min: 1
            max: 5
            hint: 'Cada rótulo vira uma aba na página, com nome, descrição, imagem e preço próprios.'
            fields:
              - { name: name, label: Nome do rótulo, widget: string, hint: 'Ex: "Bike Spritz"' }
              - { name: description, label: Descrição, widget: text, required: false }
              - name: image
                label: Imagem
                widget: object
                required: false
                fields:
                  - { name: src, label: Foto, widget: image }
                  - { name: alt, label: Texto alternativo, widget: string }
              - { name: price, label: 'Preço (opcional)', widget: string, required: false }
          - name: order
            label: Ordem
            widget: number
            value_type: int

  - name: siteMenu
    label: Cardápio do site
    icon: restaurant_menu
    files:
      - name: pacotes-de-servico
        label: Pacotes de Serviço
        file: src/content/menu-packages/pacotes-de-servico.yml
        fields:
          - { name: type, widget: hidden, default: menu }
          - { name: name, label: Nome do pacote, widget: string, hint: 'Ex: "Pacotes de Serviço"' }
          - name: combinations
            label: Abas do cardápio
            widget: list
            min: 1
            fields:
              - name: label
                label: Nome da aba
                widget: string
                hint: 'Ex: "Standard", "Premium".'
              - name: description
                label: 'Descrição breve (opcional)'
                widget: text
                required: false
                hint: 'Aparece acima da lista de drinks. Ex: "Para celebrações menores e cardápios objetivos."'
              - name: note
                label: 'Observação em texto miúdo (opcional)'
                widget: text
                required: false
                hint: 'Abaixo da descrição, em letra menor. Use **texto** para destaque colorido. Ex: regra de escolha de drinks.'
              - name: price
                label: 'Preço (opcional)'
                widget: string
                required: false
                hint: 'Ex: "R$ 45 / pessoa - R$ 2.250 total"'
              - name: image
                label: 'Imagem do painel (opcional)'
                widget: object
                required: false
                fields:
                  - { name: src, label: Foto, widget: image }
                  - { name: alt, label: Texto alternativo, widget: string }
              - name: drinks
                label: 'Drinks da aba'
                widget: list
                required: false
                max: 20
                hint: 'Escolha os drinks desta aba, na ordem em que devem aparecer. Vazio mostra "Em breve".'
                field:
                  label: Drink
                  name: drink
                  widget: relation
                  collection: drinks
                  search_fields: [name]
                  value_field: '{{slug}}'
                  display_fields: [name]
          - name: order
            label: Ordem
            widget: number
            value_type: int

  # ── Orçamentos (sob demanda): folder collection com criar/excluir liberados. ──
  # O vendedor cria uma proposta por cliente e manda o link /menu/<cliente> no
  # WhatsApp. type/hidden/order são fixos e escondidos — ele só mexe em nome+abas.
  - name: orcamentos
    label: Orçamentos
    label_singular: Orçamento
    icon: request_quote
    folder: src/content/orcamentos
    extension: yml
    format: yml
    identifier_field: name
    summary: '{{name}} - {{clientName}} - https://cinnamondrinks.com.br/menu/{{slug}}/'
    slug: '{{clientName}}'
    preview_path: '/menu/{{slug}}/'
    sortable_fields:
      fields: [createdAt, name, clientName, slug]
      default:
        field: createdAt
        direction: descending
    create: true
    delete: true
    fields:
      - { name: type, widget: hidden, default: menu }
      - { name: hidden, widget: hidden, default: true }
      - { name: order, widget: hidden, default: 99 }
      - { name: createdAt, widget: hidden, default: '{{datetime}}' }
      - name: name
        label: Nome do orçamento
        widget: string
        hint: 'Numere em sequência (ex: "Orçamento 3"). A URL agora usa o nome do cliente.'
      - name: clientName
        label: Nome do cliente
        widget: string
        pattern: ['^(?!\s*$)(?![Cc]liente n[aã]o informado$).+', 'Informe o nome real do cliente antes de salvar.']
        hint: 'Ex: "Luiz Carlos" — vira /menu/luiz-carlos/ e aparece na lista do CMS.'
      - name: publicUrl
        label: URL do orçamento
        widget: compute
        value: 'https://cinnamondrinks.com.br/menu/{{fields.clientName}}/'
      - name: combinations
        label: Abas do cardápio
        widget: list
        min: 1
        fields:
          - name: label
            label: Nome da aba
            widget: string
            hint: 'Ex: "Standard", "Premium".'
          - name: description
            label: 'Descrição breve (opcional)'
            widget: text
            required: false
            hint: 'Aparece acima da lista de drinks. Ex: "Para celebrações menores e cardápios objetivos."'
          - name: note
            label: 'Observação em texto miúdo (opcional)'
            widget: text
            required: false
            hint: 'Abaixo da descrição, em letra menor. Use **texto** para destaque colorido. Ex: regra de escolha de drinks.'
          - name: price
            label: 'Preço (opcional)'
            widget: string
            required: false
            hint: 'Ex: "R$ 45 / pessoa - R$ 2.250 total"'
          - name: image
            label: 'Imagem do painel (opcional)'
            widget: object
            required: false
            fields:
              - { name: src, label: Foto, widget: image }
              - { name: alt, label: Texto alternativo, widget: string }
          - name: drinks
            label: 'Drinks da aba'
            widget: list
            required: false
            max: 20
            hint: 'Escolha os drinks desta aba, na ordem em que devem aparecer. Vazio mostra "Em breve".'
            field:
              label: Drink
              name: drink
              widget: relation
              collection: drinks
              search_fields: [name]
              value_field: '{{slug}}'
              display_fields: [name]

  - name: testimonials
    label: Depoimentos
    label_singular: Depoimento
    icon: format_quote
    folder: src/content/testimonials
    extension: yml
    format: yml
    identifier_field: author
    slug: '{{slug}}'
    create: true
    fields:
      - { name: author, label: Autor, widget: string }
      - { name: eventType, label: Tipo de evento, widget: string, required: false }
      - { name: quote, label: Depoimento, widget: text }
      - { name: photo, label: Foto, widget: image, required: false }

  - name: form
    label: Formulário de reserva
    icon: mail
    files:
      - name: form
        label: Textos do formulário
        file: src/content/form.yml
        fields:
          - name: form
            label: Formulário
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: ctaButton, label: Texto do botão, widget: string }
              - { name: successMessage, label: Mensagem de sucesso, widget: text }
              - { name: errorMessage, label: Mensagem de erro, widget: text }
              - { name: lgpdLabel, label: Texto do checkbox LGPD, widget: string }
