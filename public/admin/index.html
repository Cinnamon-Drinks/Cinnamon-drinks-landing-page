<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Cinnamon Drinks — Painel</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.162.3/dist/sveltia-cms.js"></script>
    <style>
      .cinnamon-cms-url {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        margin-left: 4px;
        padding: 4px 8px;
        border: 1px solid #f35d7d;
        border-radius: 999px;
        background: #fff6f8;
        color: #b91f46;
        font-size: 0.875rem;
        line-height: 1.2;
        vertical-align: middle;
      }

      .cinnamon-cms-url a {
        max-width: min(52vw, 560px);
        overflow: hidden;
        color: inherit;
        font-weight: 600;
        text-decoration: none;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cinnamon-cms-url a:hover {
        text-decoration: underline;
      }

      .cinnamon-cms-copy {
        flex: 0 0 auto;
        border: 0;
        border-radius: 999px;
        background: #b91f46;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 0.75rem;
        line-height: 1;
        padding: 5px 8px;
      }

      .cinnamon-cms-copy:focus-visible {
        outline: 2px solid #f35d7d;
        outline-offset: 2px;
      }
    </style>
    <script>
      (() => {
        const quoteUrlPattern = /https:\/\/cinnamondrinks\.com\.br\/menu\/[a-z0-9-]+\/?/g;
        const ignoredTags = new Set(['A', 'BUTTON', 'INPUT', 'SCRIPT', 'STYLE', 'TEXTAREA']);

        const copyText = async (value) => {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(value);
            return;
          }

          const input = document.createElement('textarea');
          input.value = value;
          input.style.position = 'fixed';
          input.style.inset = '0 auto auto -9999px';
          document.body.append(input);
          input.select();
          document.execCommand('copy');
          input.remove();
        };

        const createUrlControl = (url) => {
          const normalizedUrl = url.endsWith('/') ? url : `${url}/`;
          const wrapper = document.createElement('span');
          wrapper.className = 'cinnamon-cms-url';
          wrapper.dataset.cinnamonUrl = normalizedUrl;

          const link = document.createElement('a');
          link.href = normalizedUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = normalizedUrl;

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'cinnamon-cms-copy';
          button.textContent = 'Copiar';
          button.addEventListener('click', async (event) => {
            event.preventDefault();
            event.stopPropagation();
            await copyText(normalizedUrl);
            button.textContent = 'Copiado';
            window.setTimeout(() => {
              button.textContent = 'Copiar';
            }, 1600);
          });

          wrapper.append(link, button);
          return wrapper;
        };

        const linkifyTextNode = (node) => {
          const text = node.nodeValue;

          if (!text || !quoteUrlPattern.test(text)) {
            quoteUrlPattern.lastIndex = 0;
            return;
          }

          quoteUrlPattern.lastIndex = 0;
          const fragment = document.createDocumentFragment();
          let cursor = 0;

          text.replace(quoteUrlPattern, (url, index) => {
            fragment.append(document.createTextNode(text.slice(cursor, index)));
            fragment.append(createUrlControl(url));
            cursor = index + url.length;
            return url;
          });

          fragment.append(document.createTextNode(text.slice(cursor)));
          node.replaceWith(fragment);
        };

        const linkifyQuoteUrls = (root = document.body) => {
          if (!root || root.nodeType !== Node.ELEMENT_NODE) return;

          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
              const parent = node.parentElement;

              if (!parent || ignoredTags.has(parent.tagName) || parent.closest('.cinnamon-cms-url')) {
                return NodeFilter.FILTER_REJECT;
              }

              quoteUrlPattern.lastIndex = 0;

              return quoteUrlPattern.test(node.nodeValue || '')
                ? NodeFilter.FILTER_ACCEPT
                : NodeFilter.FILTER_REJECT;
            }
          });

          const nodes = [];
          let node = walker.nextNode();

          while (node) {
            nodes.push(node);
            node = walker.nextNode();
          }

          nodes.forEach(linkifyTextNode);
          quoteUrlPattern.lastIndex = 0;
        };

        const observer = new MutationObserver((mutations) => {
          window.requestAnimationFrame(() => {
            mutations.forEach((mutation) => {
              mutation.addedNodes.forEach((node) => {
                if (node.nodeType === Node.ELEMENT_NODE) {
                  linkifyQuoteUrls(node);
                }
              });
            });
          });
        });

        window.addEventListener('DOMContentLoaded', () => {
          linkifyQuoteUrls();
          observer.observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>
  </body>
</html>
